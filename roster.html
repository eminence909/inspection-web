<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>จัดเวร | สภานักเรียน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Anuphan:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261111m">
<script src="font.js?v=20261111m"></script>
</head>
<body>
<header class="top">
  <a class="icon" href="index.html"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
  <div class="ttl"><b>จัดเวรประจำวัน</b><small>สำหรับผู้จัดเวร</small></div>
</header>
<main id="app"></main>
<div id="toast" role="status"></div>
<script src="config.js?v=20261111m"></script>
<script src="criteria.js?v=20261111m"></script>
<script src="calc.js?v=20261111m"></script>
<script src="summary.js?v=20261111m"></script>
<script src="roster.js?v=20261111m"></script>
<script src="lazy.js?v=20261111m"></script>
<script>
(function () {
  const $app = document.getElementById('app');
  let PIN = ''; try { PIN = sessionStorage.getItem('rpin') || ''; } catch (e) {}
  const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2400); };
  async function api(action, p) {
    const r = await fetch(window.API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, pin: PIN }, p || {})) });
    const j = await r.json(); if (!j.ok) throw new Error(j.error); return j.data;
  }
  const today = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
  function login() {
    $app.innerHTML = `<div class="card" style="max-width:380px;margin:30px auto"><h2>เข้าสู่ระบบผู้จัดเวร</h2><label>รหัสผ่าน</label>
      <input type="password" id="p" style="width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:12px"><button class="btn" id="ok">เข้าสู่ระบบ</button></div>`;
    const go = async () => { PIN = document.getElementById('p').value; try { await api('rosterLogin'); try { sessionStorage.setItem('rpin', PIN); } catch (e) {} start(); } catch (e) { PIN = ''; toast(e.message); } };
    document.getElementById('ok').onclick = go; document.getElementById('p').onkeydown = e => { if (e.key === 'Enter') go(); };
  }
  const setTopH = () => { const h = document.querySelector('.top'); if (h) document.documentElement.style.setProperty('--toph', h.getBoundingClientRect().height + 'px'); }; window.addEventListener('resize', setTopH);
  function start() {
    setTopH();
    $app.innerHTML = '<div class="tabs sect" id="rtabs"><button data-s="ed" class="on">จัดเวร</button><button data-s="dl">ดาวน์โหลดใบเวร</button><button data-s="st">สถิติ</button></div><div class="card" id="dl" hidden><div class="tb"><div><label>ดาวน์โหลดใบเวร (วันที่ที่เลือกในช่องด้านล่าง)</label></div><button class="btn warn" id="xpdf" style="margin:0;flex:0 0 110px">PDF ใบเวร</button><button class="btn warn" id="xjpg" style="margin:0;flex:0 0 110px">รูปใบเวร</button></div></div><div id="ed"></div><div id="st" hidden></div>';
    document.querySelectorAll('#rtabs button').forEach(b => b.onclick = () => { document.querySelectorAll('#rtabs button').forEach(x => x.classList.toggle('on', x === b)); ['ed', 'dl', 'st'].forEach(id => { document.getElementById(id).hidden = id !== b.dataset.s; }); window.scrollTo(0, 0); });
    let cur = today(); const dl = fn => { toast('กำลังสร้างไฟล์...'); window.loadPdfStack().then(() => window.PDFX[fn]({ date: cur, api })).then(() => toast('เสร็จแล้ว')).catch(e => toast(e.message)); };
    document.getElementById('xpdf').onclick = () => dl('roster'); document.getElementById('xjpg').onclick = () => dl('rosterImage');
    window.ROSTER.mountStats(document.getElementById('st'), { api, date: cur, toast });
    window.ROSTER.mountEditor(document.getElementById('ed'), { api, date: cur, toast, onChange: d => { cur = d; } });
  }
  if (PIN) api('rosterLogin').then(start).catch(login); else login();
})();
</script>
</body>
</html>
